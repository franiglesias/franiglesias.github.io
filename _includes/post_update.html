<aside class="post-update" aria-label="Actualización del artículo">
  <div class="post-update__header">
    <span class="post-update__badge">
      <svg class="post-update__icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
      </svg>
      {{ include.title | default: "Actualización" }}
    </span>
    {% if include.date %}
      <time class="post-update__date" datetime="{{ include.date }}">{{ include.date }}</time>
    {% endif %}
  </div>
  <div class="post-update__content">
    {% if include.text %}
      {{ include.text | markdownify }}
    {% elsif include.content %}
      {{ include.content | markdownify }}
    {% elsif include.message %}
      {{ include.message | markdownify }}
    {% endif %}
  </div>
</aside>
