---
layout: tblist-layout
---

<div class="posts tb-list">
    <header class="tag-header">
        <h2>Micro-posts sobre #{{ page.tag }}</h2>
    </header>

    {% if site.tblist %}
    {% assign tagged_posts = site.tblist | where_exp: "item", "item.tags contains page.tag" | sort: "date" | reverse %}
    {% for post in tagged_posts %}
    <article class="post">
        <h2><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h2>
        <div class="entry">
            {{ post.content }}
        </div>
    </article>
    {% endfor %}
    {% endif %}
</div>
