---
layout: basic
---

<div id="title">
    <h1>The talking list</h1>
    <p>El micro-blog de The Talking Bit</p>
</div>

<div class="posts tb-list">
    {% if site.tblist %}
    {% assign sorted_tblist = site.tblist | sort: "date" | reverse %}
    {% for post in sorted_tblist %}
    <article class="post">
        <h2><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h2>
        <div class="entry">
            {{ post.content }}
        </div>
    </article>
    {% endfor %}
    {% endif %}
</div>
