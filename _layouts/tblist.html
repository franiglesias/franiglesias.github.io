---
layout: tblist-layout
---

<div class="posts tb-list">
    {% if site.tblist %}
    {% assign sorted_tblist = site.tblist | sort: "date" | reverse %}
    {% for post in sorted_tblist %}
    <article class="post">
        <h2><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h2>
        <div class="entry">
            {{ post.content }}
        </div>
    </article>
    {% endfor %}
    {% endif %}
</div>
